global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # The tracker runs on the host; host.docker.internal is provided by the
  # extra_hosts mapping in docker-compose.yml.
  - job_name: 'aquatic-http'
    static_configs:
      - targets: ['host.docker.internal:9000']
        labels:
          instance: 'aquatic-http'
    metrics_path: /metrics

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          instance: 'tracker-server'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
