# Standalone monitoring stack for a tracker running on the host.
#
# Usage:
#   GRAFANA_ADMIN_PASSWORD='strong-password' docker compose up -d
#   GRAFANA_ROOT_URL='https://tracker.example.com' GRAFANA_ADMIN_PASSWORD='...' docker compose up -d

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: aquatic-prometheus
    restart: unless-stopped
    # aquatic binds its metrics to 127.0.0.1, which is unreachable from a
    # bridged container. Host networking also means 9090 is already listening
    # on the host, so no ports mapping is needed.
    network_mode: host
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'

  node-exporter:
    image: prom/node-exporter:latest
    container_name: aquatic-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.netclass.ignored-devices=^(veth.*)$$'

  grafana:
    image: grafana/grafana:latest
    container_name: aquatic-grafana
    restart: unless-stopped
    ports:
      # 3000 is a common tracker port, so use 3001 on the host.
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3001}
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    # Prometheus now runs on the host network, so Grafana reaches it through
    # the host gateway instead of the compose service name.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  prometheus-data:
  grafana-data:
