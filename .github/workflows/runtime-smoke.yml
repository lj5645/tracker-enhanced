name: Runtime Smoke Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # glommio/io_uring needs privileged access in a container. The image
    # matches the Ubuntu version the release binaries are built on.
    container:
      image: ubuntu:24.04
      options: --privileged --security-opt seccomp=unconfined --ulimit memlock=524288:524288
    steps:
      - uses: actions/checkout@v4

      - name: Install build and runtime dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates file python3 python3-pip libhwloc15 \
            build-essential cmake git
          python3 -m pip install --break-system-packages 'websockets==15.0.1'

      - name: Install latest stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust dependency caching
        uses: Swatinem/rust-cache@v2

      # Build from the checked-out ref instead of downloading a release, so a
      # fix can be runtime-tested before a new release is published.
      - name: Build tracker binaries
        run: |
          set -eux
          cargo build --release -p aquatic_udp -p aquatic_http -p aquatic_ws
          mkdir -p /tmp/bin
          cp target/release/aquatic_udp \
             target/release/aquatic_http \
             target/release/aquatic_ws \
             /tmp/bin/
          file /tmp/bin/aquatic_*

      - name: Run runtime smoke tests
        run: |
          python3 -I scripts/runtime-smoke/runtime_smoke.py \
            --bin-dir /tmp/bin \
            --work-dir /tmp/runtime

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke-logs
          path: /tmp/runtime/**/server.log
          if-no-files-found: ignore
          retention-days: 3
