name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    # Pin to 24.04: glommio 0.9 / bundled liburing fails to compile against
    # the newer kernel headers shipped with ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Install latest stable Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Setup Rust dependency caching
      uses: Swatinem/rust-cache@v2
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libhwloc-dev
    - name: Build
      run: |
        cargo build --verbose -p aquatic_udp --features metrics
        cargo build --verbose -p aquatic_http --features metrics
        cargo build --verbose -p aquatic_ws --features metrics
        cargo build --verbose -p aquatic_http --features "metrics,cpu-pinning"
    - name: Build combined binary (all protocols)
      run: |
        cargo build --verbose -p aquatic --no-default-features \
          --features "udp,http,ws,prometheus,mimalloc,cpu-pinning"

  build-windows:
    # Windows cannot compile the glommio/io_uring based HTTP and WebSocket
    # trackers: verify that the combined binary builds with UDP only, which is
    # exactly what the release workflow ships for Windows.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Install latest stable Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Setup Rust dependency caching
      uses: Swatinem/rust-cache@v2
    - name: Build (UDP only)
      run: cargo build --verbose -p aquatic --no-default-features --features udp
    # The build above only proves that the code compiles here. The privilege
    # config is the one place with platform-dependent behaviour (fields exist
    # everywhere, enabling them must fail on Windows), so run just those tests.
    - name: Test privilege config behaviour
      run: cargo test --verbose -p aquatic_common --lib privileges

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Install latest stable Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Setup Rust dependency caching
      uses: Swatinem/rust-cache@v2
    - name: Build
      run: cargo build --verbose -p aquatic_udp --features metrics

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Install latest stable Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Setup Rust dependency caching
      uses: Swatinem/rust-cache@v2
    - name: Run tests
      run: cargo test --verbose --profile "test-fast" --workspace
    - name: Run tests (aquatic_udp with io_uring)
      run: cargo test --verbose --profile "test-fast" -p aquatic_udp --features "io-uring"

  test-file-transfers:
    runs-on: ubuntu-latest
    name: "Test BitTorrent file transfers (UDP, HTTP, WebTorrent)"
    timeout-minutes: 20
    container:
      image: rust:1-bookworm
      options: --ulimit memlock=524288:524288 --privileged --security-opt="seccomp=unconfined"
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Test file transfers
        uses: ./.github/actions/test-file-transfers
        id: test_file_transfers
