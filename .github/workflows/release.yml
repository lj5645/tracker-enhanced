name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Pre-release'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    
    - name: Install latest stable Rust
      uses: dtolnay/rust-toolchain@stable
      
    - name: Setup Rust dependency caching
      uses: Swatinem/rust-cache@v2
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential
    
    - name: Build aquatic_udp
      run: |
        cargo build --release -p aquatic_udp --features metrics
        strip target/release/aquatic_udp
        mv target/release/aquatic_udp target/release/aquatic_udp-linux-x86_64
    
    - name: Build aquatic_http
      run: |
        cargo build --release -p aquatic_http --features metrics
        strip target/release/aquatic_http
        mv target/release/aquatic_http target/release/aquatic_http-linux-x86_64
    
    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-binaries
        path: |
          target/release/aquatic_udp-linux-x86_64
          target/release/aquatic_http-linux-x86_64
        retention-days: 1

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    
    - name: Install latest stable Rust
      uses: dtolnay/rust-toolchain@stable
      
    - name: Setup Rust dependency caching
      uses: Swatinem/rust-cache@v2
    
    - name: Install cmake
      run: choco install cmake -y
    
    - name: Build aquatic_udp
      run: |
        cargo build --release -p aquatic_udp --features metrics
        mv target/release/aquatic_udp.exe target/release/aquatic_udp-windows-x86_64.exe
    
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-binaries
        path: target/release/aquatic_udp-windows-x86_64.exe
        retention-days: 1

  create-release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Display structure of downloaded files
      run: ls -R artifacts
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: Tracker Enhanced ${{ github.event.inputs.version }}
        body: |
          ## Aquatic Tracker Enhanced Version
          
          ### Features
          - IP Ban with CIDR range support
          - Client Ban with peer_id pattern matching
          - Client Whitelist with User-Agent filtering
          - Request Filter for SQL injection, path traversal, and crawlers
          - Hot reload support via SIGUSR1/SIGUSR2
          - Prometheus metrics support
          
          ### Binaries
          | Platform | File |
          |----------|------|
          | Linux x86_64 | aquatic_udp-linux-x86_64, aquatic_http-linux-x86_64 |
          | Windows x86_64 | aquatic_udp-windows-x86_64.exe |
          
          ### Usage
          ```bash
          # Linux
          chmod +x aquatic_*
          ./aquatic_http -c aquatic-http.toml
          
          # Windows (only aquatic_udp available)
          .\aquatic_udp.exe -c aquatic-udp.toml
          ```
          
          ### Note
          - aquatic_http only supports Linux (requires glommio/io_uring)
          - aquatic_udp supports both Linux and Windows
        draft: false
        prerelease: ${{ github.event.inputs.prerelease == 'true' }}
        files: |
          artifacts/linux-binaries/*
          artifacts/windows-binaries/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
