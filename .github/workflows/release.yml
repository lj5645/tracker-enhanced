name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Pre-release'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    
    - name: Install latest stable Rust
      uses: dtolnay/rust-toolchain@stable
      
    - name: Setup Rust dependency caching
      uses: Swatinem/rust-cache@v2
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libhwloc-dev
    
    - name: Build aquatic_udp
      run: |
        cargo build --release -p aquatic_udp
        strip target/release/aquatic_udp
        mv target/release/aquatic_udp target/release/aquatic_udp-linux-x86_64
    
    - name: Build aquatic_http
      run: |
        cargo build --release -p aquatic_http --features cpu-pinning
        strip target/release/aquatic_http
        mv target/release/aquatic_http target/release/aquatic_http-linux-x86_64
    
    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-binaries
        path: |
          target/release/aquatic_udp-linux-x86_64
          target/release/aquatic_http-linux-x86_64
        retention-days: 1

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    
    - name: Install latest stable Rust
      uses: dtolnay/rust-toolchain@stable
      
    - name: Setup Rust dependency caching
      uses: Swatinem/rust-cache@v2
    
    - name: Install cmake
      run: choco install cmake -y
    
    - name: Build aquatic_udp
      run: |
        cargo build --release -p aquatic_udp --no-default-features
        mv target/release/aquatic_udp.exe target/release/aquatic_udp-windows-x86_64.exe
    
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-binaries
        path: target/release/aquatic_udp-windows-x86_64.exe
        retention-days: 1

  create-release:
    needs: [build-linux, build-windows]
    if: always() && needs.build-linux.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    
    - name: Download Linux artifacts
      uses: actions/download-artifact@v4
      with:
        name: linux-binaries
        path: artifacts/linux-binaries
    
    - name: Download Windows artifacts
      if: needs.build-windows.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: windows-binaries
        path: artifacts/windows-binaries
    
    - name: Display structure of downloaded files
      run: ls -R artifacts
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: Aquatic Tracker 增强版 ${{ github.event.inputs.version }}
        body: |
          ## Aquatic BitTorrent Tracker 增强版

          基于 Aquatic 的高性能 BitTorrent Tracker，新增安全防护和性能优化功能。

          ### 功能特性
          - IP 封禁（支持 CIDR 网段）
          - 客户端封禁（吸血客户端拦截）
          - 客户端白名单（User-Agent 过滤）
          - 请求过滤（SQL 注入、路径遍历、爬虫拦截）
          - TCP Keepalive（死连接快速清理）
          - 连接数限制（防止连接风暴）
          - Socket 缓冲区优化（防止高负载丢包）
          - CPU 绑定（可选，需要 hwloc）
          - 热重载配置（SIGUSR1/SIGUSR2）
          - Prometheus 指标导出

          ### 下载文件
          | 平台 | 文件 |
          |------|------|
          | Linux x86_64 | aquatic_udp-linux-x86_64, aquatic_http-linux-x86_64 |
          | Windows x86_64 | aquatic_udp-windows-x86_64.exe（如可用） |

          ### 使用方法
          ```bash
          # Linux
          chmod +x aquatic_*
          ./aquatic_http-linux-x86_64 -c aquatic-http.toml

          # Windows（仅 aquatic_udp 可用）
          .\aquatic_udp.exe -c aquatic-udp.toml
          ```

          ### 运行时依赖
          - HTTP Tracker 需要 Linux 5.8+（依赖 glommio/io_uring）
          - 如启用 CPU 绑定功能，需安装: `sudo apt-get install libhwloc15`
          - UDP Tracker 支持 Linux 和 Windows

          ### 系统优化建议
          ```bash
          ulimit -n 1048576
          sudo sysctl -w fs.file-max=1048576
          sudo sysctl -w net.core.rmem_max=8388608
          sudo sysctl -w net.core.wmem_max=8388608
          ```
        draft: false
        prerelease: ${{ github.event.inputs.prerelease == 'true' }}
        fail_on_unmatched_files: false
        files: |
          artifacts/linux-binaries/*
          artifacts/windows-binaries/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
