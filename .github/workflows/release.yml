name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.5.0)'
        required: true
        type: string
      prerelease:
        description: 'Pre-release'
        required: false
        type: boolean
        default: false
      build_udp:
        description: 'Linux: include UDP tracker（Windows 始终包含 UDP）'
        required: false
        type: boolean
        default: true
      build_http:
        description: 'Linux: include HTTP tracker（仅 Linux 支持）'
        required: false
        type: boolean
        default: true
      build_ws:
        description: 'Linux: include WebSocket tracker（仅 Linux 支持）'
        required: false
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    # Pin to 24.04: glommio 0.9 / bundled liburing fails to compile against
    # the newer kernel headers shipped with ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - name: Install latest stable Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Setup Rust dependency caching
      uses: Swatinem/rust-cache@v2

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libhwloc-dev

    - name: Select protocols
      id: protocols
      run: |
        features=""
        if [ "${{ inputs.build_udp }}" = "true" ]; then
          features="udp"
        fi
        if [ "${{ inputs.build_http }}" = "true" ]; then
          features="${features:+$features,}http"
        fi
        if [ "${{ inputs.build_ws }}" = "true" ]; then
          features="${features:+$features,}ws"
        fi
        if [ -z "$features" ]; then
          echo "至少需要启用一个协议（build_udp / build_http / build_ws）" >&2
          exit 1
        fi

        features="$features,prometheus,mimalloc"
        if [ "${{ inputs.build_http }}" = "true" ]; then
          features="$features,cpu-pinning"
        fi

        echo "features=$features" >> "$GITHUB_OUTPUT"
        echo "Building with features: $features"

    - name: Build aquatic (Linux)
      run: |
        cargo build --release -p aquatic --no-default-features \
          --features "${{ steps.protocols.outputs.features }}"
        strip target/release/aquatic
        mv target/release/aquatic target/release/aquatic-linux-x86_64

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-binaries
        path: target/release/aquatic-linux-x86_64
        retention-days: 1

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - name: Install latest stable Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Setup Rust dependency caching
      uses: Swatinem/rust-cache@v2

    - name: Build aquatic (Windows, UDP only)
      # The HTTP and WebSocket trackers depend on glommio/io_uring and cannot
      # be compiled on Windows, so only the protocols Windows supports are
      # built into the binary.
      run: |
        cargo build --release -p aquatic --no-default-features --features udp
        mv target/release/aquatic.exe target/release/aquatic-windows-x86_64.exe

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-binaries
        path: target/release/aquatic-windows-x86_64.exe
        retention-days: 1

  create-release:
    needs: [build-linux, build-windows]
    if: always() && needs.build-linux.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download Linux artifacts
      uses: actions/download-artifact@v4
      with:
        name: linux-binaries
        path: artifacts/linux-binaries

    - name: Download Windows artifacts
      if: needs.build-windows.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: windows-binaries
        path: artifacts/windows-binaries

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.version }}
        name: Aquatic Tracker 增强版 ${{ inputs.version }}
        body: |
          ## Aquatic BitTorrent Tracker 增强版

          基于 Aquatic 的高性能 BitTorrent Tracker，新增安全防护和性能优化功能。

          ### 功能特性
          - IP 封禁（支持 CIDR 网段）
          - 客户端封禁（吸血客户端拦截）
          - 客户端白名单（User-Agent 子串 / peer_id 前缀，HTTP/UDP/WS 通用）
          - 请求过滤（SQL 注入、路径遍历、爬虫拦截）
          - TCP Keepalive（死连接快速清理）
          - 连接数限制（防止连接风暴）
          - Socket 缓冲区优化（防止高负载丢包）
          - CPU 绑定（可选，需要 hwloc）
          - 热重载配置（SIGUSR1/SIGUSR2）
          - Prometheus 指标导出

          ### 下载文件
          | 平台 | 文件 | 包含协议 |
          |------|------|----------|
          | Linux x86_64 | `aquatic-linux-x86_64` | ${{ inputs.build_udp == true && 'UDP' || '' }}${{ inputs.build_http == true && ' / HTTP' || '' }}${{ inputs.build_ws == true && ' / WebSocket' || '' }} |
          | Windows x86_64 | `aquatic-windows-x86_64.exe` | UDP（Windows 不支持 HTTP/WebSocket） |

          ### 使用方法
          ```bash
          # Linux
          chmod +x aquatic-linux-x86_64
          ./aquatic-linux-x86_64 udp -c aquatic-udp-config.toml
          ./aquatic-linux-x86_64 http -c aquatic-http-config.toml
          ./aquatic-linux-x86_64 ws -c aquatic-ws-config.toml

          # Windows（仅 UDP）
          .\aquatic-windows-x86_64.exe udp -c aquatic-udp-config.toml
          ```

          运行 `./aquatic-linux-x86_64 --help` 可查看当前二进制实际包含的协议。
          示例配置（TOML）与封禁/白名单列表示例请从仓库根目录获取，Release 仅提供编译产物。

          ### 运行时依赖
          - HTTP Tracker 需要 Linux 5.8+（依赖 glommio/io_uring）
          - 如启用 CPU 绑定功能，需安装: `sudo apt-get install libhwloc15`
          - UDP Tracker 支持 Linux 和 Windows

          ### 系统优化建议
          ```bash
          ulimit -n 1048576
          sudo sysctl -w fs.file-max=1048576
          sudo sysctl -w net.core.rmem_max=8388608
          sudo sysctl -w net.core.wmem_max=8388608
          ```
        draft: false
        prerelease: ${{ inputs.prerelease == true }}
        fail_on_unmatched_files: false
        files: |
          artifacts/linux-binaries/*
          artifacts/windows-binaries/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
