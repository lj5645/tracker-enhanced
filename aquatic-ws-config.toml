# aquatic_ws (WebTorrent) 配置文件
# 用法: ./aquatic-linux-x86_64 ws -c aquatic-ws-config.toml
# 需要 Linux 5.8+（glommio / io_uring）

socket_workers = 1
swarm_workers = 1
log_level = "warn"

[network]
address = "0.0.0.0:6970"
only_ipv6 = false
tcp_backlog = 1024
# 每个 socket worker 的最大并发连接数，0 表示不限制
# WebSocket 是长连接，连接风暴时该限制可防止内存耗尽
max_connections_per_worker = 100000
enable_tls = false
tls_certificate_path = ""
tls_private_key_path = ""
enable_http_health_checks = false

[protocol]
max_scrape_torrents = 255
max_offers = 10
peer_announce_interval = 120

[access_list]
mode = "off"
path = "./access-list.txt"

[ip_ban]
mode = "on"
path = "./ip-ban-list.txt"

[client_ban]
mode = "on"
path = "./client-ban-list.txt"
# 是否同时封禁内置的吸血客户端前缀（-xl、-sd、-qd、-bn、-bc 等）
ban_vampire_clients = true

[client_whitelist]
# 支持 User-Agent 子串和以 "-" 开头的 peer_id 前缀
mode = "off"
path = "./client-whitelist.txt"

[request_filter]
filter_sql_injection = false
filter_path_traversal = false
filter_crawlers = false
filter_private_ips = false
filter_missing_user_agent = false

[trusted_proxies]
# 仅在确实位于反向代理后面时启用，并填写代理 IP/CIDR 列表
enabled = false
path = ""

[auto_ban]
enabled = false
threshold = 10
window_secs = 60
ban_duration_secs = 0
ban_list_path = "./ip-ban-list.txt"
flush_interval_secs = 60
