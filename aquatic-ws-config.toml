# aquatic_ws (WebTorrent) 配置文件
# 用法: ./aquatic-linux-x86_64 ws -c aquatic-ws-config.toml
# 需要 Linux 5.8+（glommio / io_uring）

socket_workers = 1
swarm_workers = 1
log_level = "warn"

[network]
address = "0.0.0.0:6970"
only_ipv6 = false
tcp_backlog = 1024
# 每个 socket worker 的最大并发连接数，0 表示不限制
# WebSocket 是长连接，连接风暴时该限制可防止内存耗尽
max_connections_per_worker = 100000
enable_tls = false
tls_certificate_path = ""
tls_private_key_path = ""
enable_http_health_checks = false

[protocol]
max_scrape_torrents = 255
max_offers = 10
peer_announce_interval = 120

[access_list]
mode = "off"
path = "./access-list.txt"

[ip_ban]
mode = "on"
path = "./ip-ban-list.txt"

[client_ban]
mode = "on"
path = "./client-ban-list.txt"
# 是否同时封禁内置的吸血客户端前缀（-xl、-sd、-qd、-bn、-bc 等）
ban_vampire_clients = true

# 非标准 peer_id 检测: off, warn, enforce
# warn 只记录日志（每分钟最多一条），enforce 拒绝 announce。
# 检查 peer_id 结构（Azureus / Mainline 格式）和明显不可能的大版本号。
peer_id_strictness = "off"

# peer_id 与 User-Agent 客户端家族一致性检测: off, warn, enforce
# User-Agent 无法识别为 BT 客户端时跳过，避免误判浏览器客户端。
peer_id_user_agent_mismatch = "off"

# 额外放行的 peer_id 前缀文件，每行一个前缀（留空表示不使用）
# 命中的 peer_id 会同时跳过上面的结构校验与 User-Agent 一致性检查
peer_id_allowlist_path = ""

[client_whitelist]
# 支持 User-Agent 子串和以 "-" 开头的 peer_id 前缀
mode = "off"
path = "./client-whitelist.txt"

[request_filter]
filter_sql_injection = false
filter_path_traversal = false
filter_crawlers = false
filter_private_ips = false
filter_missing_user_agent = false

[trusted_proxies]
# 仅在确实位于反向代理后面时启用，并填写代理 IP/CIDR 列表
enabled = false
path = ""

[auto_ban]
# 永久封禁（ban_duration_secs = 0）触发时立即写盘，重启后仍然生效；
# 此时 ban_list_path 必须与 [ip_ban] 的 path 一致且 [ip_ban] mode = "on"，
# 否则服务拒绝启动。临时封禁仅内存有效，重启后丢失。
enabled = false
threshold = 10
window_secs = 60
ban_duration_secs = 0
ban_list_path = "./ip-ban-list.txt"
flush_interval_secs = 60
