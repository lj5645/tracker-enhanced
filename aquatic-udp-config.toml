# aquatic_udp 配置文件
# 用法: ./aquatic_udp-linux-x86_64 -c aquatic-udp-config.toml

# 0 = 自动使用可用 CPU 核心数
socket_workers = 0

# 日志级别: error, warn, info, debug, trace
log_level = "warn"

[network]
use_ipv4 = true
use_ipv6 = true
address_ipv4 = "0.0.0.0:6969"
address_ipv6 = "[::]:6969"
# 内核允许时建议调大，防止高负载丢包
socket_recv_buffer_size = 8000000
set_only_ipv6 = true

[protocol]
max_scrape_torrents = 70
max_response_peers = 50
peer_announce_interval = 120

[access_list]
mode = "off"
path = "./access-list.txt"

[ip_ban]
mode = "on"
path = "./ip-ban-list.txt"

[client_ban]
mode = "on"
path = "./client-ban-list.txt"

[client_whitelist]
# UDP 没有 User-Agent，启用时白名单文件必须包含 peer_id 前缀
# （以 "-" 开头的行，例如 -ut / -tr / -qb），否则启动会报错。
mode = "off"
path = "./client-whitelist.txt"

[request_filter]
# 默认关闭，按需开启
filter_private_ips = false
filter_missing_user_agent = false

[auto_ban]
# 自动封禁默认关闭。启用时如果 ban_duration_secs = 0（永久），
# ban_list_path 必须与上面 [ip_ban] 的 path 完全一致。
enabled = false
threshold = 10
window_secs = 60
ban_duration_secs = 0
ban_list_path = "./ip-ban-list.txt"
flush_interval_secs = 60
