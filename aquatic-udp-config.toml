# aquatic_udp 配置文件
# 用法: ./aquatic-linux-x86_64 udp -c aquatic-udp-config.toml

# 0 = 自动使用可用 CPU 核心数
socket_workers = 0

# 日志级别: error, warn, info, debug, trace
log_level = "warn"

[network]
use_ipv4 = true
use_ipv6 = true
address_ipv4 = "0.0.0.0:6969"
address_ipv6 = "[::]:6969"
# 内核允许时建议调大，防止高负载丢包
socket_recv_buffer_size = 8000000
set_only_ipv6 = true

[protocol]
max_scrape_torrents = 70
max_response_peers = 50
peer_announce_interval = 120

[access_list]
mode = "off"
path = "./access-list.txt"

[ip_ban]
mode = "on"
path = "./ip-ban-list.txt"

[client_ban]
mode = "on"
path = "./client-ban-list.txt"
# 是否同时封禁内置的吸血客户端前缀（-xl、-sd、-qd、-bn、-bc 等）
# 设为 false 时只使用列表文件中的规则
ban_vampire_clients = true

# 非标准 peer_id 检测: off, warn, enforce
# warn 只记录日志（每分钟最多一条），enforce 丢弃 announce。
# 检查 peer_id 结构（Azureus / Mainline 格式）和明显不可能的大版本号。
# UDP 没有 User-Agent，因此不涉及 peer_id_user_agent_mismatch。
peer_id_strictness = "off"

# 额外放行的 peer_id 前缀文件，每行一个前缀（留空表示不使用）
peer_id_allowlist_path = ""

[client_whitelist]
# UDP 没有 User-Agent，启用时白名单文件必须包含 peer_id 前缀
# （以 "-" 开头的行，例如 -ut / -tr / -qb），否则启动会报错。
mode = "off"
path = "./client-whitelist.txt"

[request_filter]
# 默认关闭，按需开启
filter_private_ips = false
filter_missing_user_agent = false

[auto_ban]
# 自动封禁默认关闭。
# 永久封禁（ban_duration_secs = 0）触发时立即写入文件，重启后仍然生效。
# 此时 ban_list_path 必须与上面 [ip_ban] 的 path 完全一致，且 [ip_ban] mode = "on"，
# 否则服务拒绝启动（否则文件不会被加载，重启后封禁失效）。
# 临时封禁（ban_duration_secs > 0）仅保存在内存中，重启后丢失。
enabled = false
threshold = 10
window_secs = 60
ban_duration_secs = 0
ban_list_path = "./ip-ban-list.txt"
flush_interval_secs = 60
