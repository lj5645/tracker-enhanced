# aquatic 快速启动配置（config.toml）
#
# 一份文件同时描述三个协议，启动哪个协议由命令行决定：
#
#   ./aquatic udp  -c config.toml     # BitTorrent over UDP
#   ./aquatic http -c config.toml     # BitTorrent over HTTP(S)
#   ./aquatic ws   -c config.toml     # WebTorrent over WebSocket(S)
#
# 一个进程只运行一个协议；三个都要跑就起三个进程（或用 systemd 模板）。
# 只有命令行选中的那张表会被解析，其余表原样忽略，所以三段可以同时留着。
#
# 没写的字段一律取默认值。要看某协议的全部字段：
#   ./aquatic udp -p        # 单协议默认配置（可直接重定向成文件）
#   ./aquatic -p            # 三段合并模板（带注释、端口已错开）
#
# 端口说明：HTTP 与 WebSocket 同为 TCP，必须用不同端口；UDP 与 TCP 的端口空间
# 相互独立，UDP 可以和某个 TCP 端口重号。下面按 6969 / 8080 / 8081 错开。
#
# 封禁列表用相对路径，请在仓库根目录或部署目录下运行，并确保
# ip-ban-list.txt / client-ban-list.txt 存在（仓库自带示例）。

# ============================================================
# BitTorrent over UDP
# ============================================================
[udp]
# 0 = 按 CPU 核心数自动设置
socket_workers = 0
log_level = "warn"

[udp.network]
use_ipv4 = true
use_ipv6 = true
address_ipv4 = "0.0.0.0:6969"
address_ipv6 = "[::]:6969"
# 接收缓冲区；0 表示用系统默认值
socket_recv_buffer_size = 8000000
set_only_ipv6 = true

[udp.protocol]
max_scrape_torrents = 70
max_response_peers = 50
peer_announce_interval = 120

[udp.ip_ban]
mode = "on"
path = "./ip-ban-list.txt"

[udp.client_ban]
mode = "on"
path = "./client-ban-list.txt"
# 内置吸血客户端前缀（迅雷/旋风/BitComet 等）
ban_vampire_clients = true
# off | warn | enforce
peer_id_strictness = "off"
peer_id_allowlist_path = ""

[udp.request_filter]
filter_sql_injection = false
filter_path_traversal = false
filter_crawlers = false
filter_private_ips = false
filter_missing_user_agent = false

[udp.auto_ban]
# 默认关闭：依赖上面的过滤器计数，误判会造成批量封禁。先看日志再启用
enabled = false
threshold = 10
window_secs = 60
ban_duration_secs = 0
immediate_ban_secs = 0
# 吸血客户端封禁时长：固定 1 天，且永不升级为永久封禁
client_ban_duration_secs = 86400
# 到期时间抖动（±秒），避免同一批封禁同时解封造成请求尖峰
client_ban_jitter_secs = 1800
# 客户端封禁 IP 的持久化文件（带过期时间，重启后仍生效）
client_ban_list_path = "./client-ban-ips.txt"
ban_list_path = "./ip-ban-list.txt"
flush_interval_secs = 60

# ============================================================
# BitTorrent over HTTP（仅 Linux 5.8+）
# ============================================================
[http]
socket_workers = 0
swarm_workers = 1
log_level = "warn"

[http.network]
use_ipv4 = true
use_ipv6 = true
address_ipv4 = "0.0.0.0:8080"
address_ipv6 = "[::]:8080"
enable_tls = false
tls_certificate_path = ""
tls_private_key_path = ""
keep_alive = true
# 位于 nginx/CDN 之后时改为 true，并配置 [http.trusted_proxies]
runs_behind_reverse_proxy = false
max_connections_per_worker = 100000
socket_recv_buffer_size = 2097152
socket_send_buffer_size = 2097152
tcp_keepalive = true

[http.protocol]
max_scrape_torrents = 100
max_peers = 50
peer_announce_interval = 120

[http.ip_ban]
mode = "on"
path = "./ip-ban-list.txt"

[http.client_ban]
mode = "on"
path = "./client-ban-list.txt"
ban_vampire_clients = true
peer_id_strictness = "off"
peer_id_user_agent_mismatch = "off"
peer_id_allowlist_path = ""

[http.request_filter]
filter_sql_injection = false
filter_path_traversal = false
filter_crawlers = false
filter_private_ips = false
filter_missing_user_agent = false

[http.trusted_proxies]
# 只在 runs_behind_reverse_proxy = true 时需要
enabled = false
path = ""

[http.auto_ban]
enabled = false
threshold = 10
window_secs = 60
ban_duration_secs = 0
immediate_ban_secs = 0
# 吸血客户端封禁时长：固定 1 天，且永不升级为永久封禁
client_ban_duration_secs = 86400
# 到期时间抖动（±秒），避免同一批封禁同时解封造成请求尖峰
client_ban_jitter_secs = 1800
# 客户端封禁 IP 的持久化文件（带过期时间，重启后仍生效）
client_ban_list_path = "./client-ban-ips.txt"
ban_list_path = "./ip-ban-list.txt"
flush_interval_secs = 60

# ============================================================
# WebTorrent over WebSocket（仅 Linux 5.8+）
# ============================================================
[ws]
socket_workers = 1
swarm_workers = 1
log_level = "warn"

[ws.network]
address = "0.0.0.0:8081"
only_ipv6 = false
tcp_backlog = 1024
# 长连接场景用连接数上限控制内存，而不是 TCP keepalive
max_connections_per_worker = 100000
enable_tls = false
tls_certificate_path = ""
tls_private_key_path = ""
enable_http_health_checks = false

[ws.protocol]
max_scrape_torrents = 255
max_offers = 10
peer_announce_interval = 120

[ws.ip_ban]
mode = "on"
path = "./ip-ban-list.txt"

[ws.client_ban]
mode = "on"
path = "./client-ban-list.txt"
ban_vampire_clients = true
peer_id_strictness = "off"
peer_id_user_agent_mismatch = "off"
peer_id_allowlist_path = ""

[ws.request_filter]
filter_sql_injection = false
filter_path_traversal = false
filter_crawlers = false
filter_private_ips = false
filter_missing_user_agent = false

[ws.trusted_proxies]
enabled = false
path = ""

[ws.auto_ban]
enabled = false
threshold = 10
window_secs = 60
ban_duration_secs = 0
immediate_ban_secs = 0
# 吸血客户端封禁时长：固定 1 天，且永不升级为永久封禁
client_ban_duration_secs = 86400
# 到期时间抖动（±秒），避免同一批封禁同时解封造成请求尖峰
client_ban_jitter_secs = 1800
# 客户端封禁 IP 的持久化文件（带过期时间，重启后仍生效）
client_ban_list_path = "./client-ban-ips.txt"
ban_list_path = "./ip-ban-list.txt"
flush_interval_secs = 60

# ============================================================
# Prometheus 指标（默认关闭，需要编译时启用 prometheus / metrics feature）
# ============================================================
# 打开后三个协议要用不同端口，且建议只监听本机：端点没有认证。
#
# [udp.statistics]
# run_prometheus_endpoint = true
# prometheus_endpoint_address = "127.0.0.1:9001"
#
# [http.metrics]
# run_prometheus_endpoint = true
# prometheus_endpoint_address = "127.0.0.1:9002"
#
# [ws.metrics]
# run_prometheus_endpoint = true
# prometheus_endpoint_address = "127.0.0.1:9003"
#
# 其余段落（[*.cleaning]、[*.privileges]、[*.cpu_pinning] 等）用 `./aquatic <协议> -p` 查看。
